# Link checker configuration (https://lychee.cli.rs), used by CI.

# Check #fragment anchors in Markdown and HTML links.
include_fragments = "anchor-only"

max_retries = 3
retry_wait_time = 5
timeout = 30
# 429: rate limited, not broken.
accept = ["200..=299", "429"]

exclude_path = ["(^|/)node_modules/", "(^|/)dist/", "(^|/)coverage/"]

exclude = [
  # Local endpoints and placeholder domains used in examples.
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  '^https?://([a-z0-9-]+\.)*example\.(com|org)',
]
