# MCP Tool Validator Configuration
# See https://github.com/chief-builder/mcp_tool_description_validator for full documentation

# Rule configuration
# Set to false (or off) to disable a rule, or set to 'error', 'warning', or
# 'suggestion' to override severity. Unknown rule IDs are rejected.
# See docs/RULES.md for every rule.
rules:
  # Schema rules (SCH-xxx) - JSON Schema compliance
  # SCH-004: true  # inputSchema and outputSchema must be valid JSON Schema

  # Naming rules (NAM-xxx) - Naming convention enforcement
  # NAM-002: true  # Tool name should be 1-128 characters using only [A-Za-z0-9_.-]

  # Security rules (SEC-xxx) - Security vulnerability detection
  # SEC-001: true  # String parameters must have maxLength (except content fields)
  # SEC-002: true  # Array parameters must have maxItems

  # LLM compatibility rules (LLM-xxx) - LLM understanding optimization
  # LLM-001: true  # Tool description should be non-empty
  # LLM-005: error  # Override severity to error

  # Best practice rules (BP-xxx) - Recommended patterns
  # BP-001: false  # Disable a rule entirely

# Output configuration
output:
  format: human # human | json | sarif
  verbose: false # Show additional details
  color: true # Enable colored output (terminal only)

# MCP protocol revision: 2026-07-28 (default, the latest released revision)
# or 2025-11-25.
specVersion: '2026-07-28'

# Optional live-discovery revision. Omit to inherit specVersion.
# discoverySpecVersion: "2025-11-25"

# governance preserves strict policy severities; compliance downgrades
# non-specification errors to warnings while retaining the findings.
profile: governance

# LLM analysis configuration (optional)
# Enables AI-powered semantic analysis of tool definitions
# llm:
#   enabled: false
#   provider: anthropic   # anthropic | openai | ollama
#   model: claude-haiku-4-5
#   # apiKey: sk-xxx      # Or set via ANTHROPIC_API_KEY / OPENAI_API_KEY env var
#   # baseUrl: https://api.example.com  # For custom endpoints
#   timeout: 30000        # Request timeout in milliseconds
